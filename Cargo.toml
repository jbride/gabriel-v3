[package]
name = "gabriel-v3"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.95"
axum = "0.7"
chrono = "0.4.39"
crossbeam-channel = "0.5"
env_logger = "0.11.6"
futures = "0.3"
headless_chrome = "1.0.17"
log = "0.4.22"

floresta = { git = "https://github.com/vinteumorg/floresta", tag = "0.7.0" }
floresta-chain = { git = "https://github.com/vinteumorg/floresta", tag = "0.7.0" }
floresta-wire = { git = "https://github.com/vinteumorg/floresta", tag = "0.7.0" }
rustreexo = "0.3.0"
bitcoin = "0.32"
nakamoto = "0.4.0"

# features= bundled
#   This causes rusqlite to compile its own private libsqlite3 and link it with your Rust code, instead of using /usr/lib/x86_64-linux-gnu/libsqlite3.so
rusqlite = { version = "0.32.1", features = ["bundled"] }

serde = { version = "1.0.201", features = ["derive"] }
serde_json = "1.0"
sled = "0.34.7"
sqlx = { version = "0.8.2", features = ["sqlite", "runtime-tokio"] }
thiserror = "2.0"
tokio = { version = "1.40.0", features = ["full"] }
tower-http = { version = "0.5.2", features = ["full"] }
tracing = "0.1.41"
tracing-subscriber = "0.3.19"
bitcoin_hashes = "0.16.0"
rand = "0.9.0"

[profile.release]
# if set to true, expect larger binary size of 2-5x more
debug = true
